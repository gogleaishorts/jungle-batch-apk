name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Failed to detect Java version string."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Failed to detect Java major version."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or newer (detected: $MAJOR_VERSION)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION ($RAW_VERSION)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be generated or found."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path does not match expected location."
            exit 1
          fi
          echo "Debug APK verified successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_TMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset-XXXXXX")
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          SANITIZED_NAME=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi
          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_TMP_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset validation failed before publishing: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an .apk file"; exit 1 ;;
          esac
          TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          TITLE="Debug APK Build #${RUN_NUM}"
          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${RUN_NUM}

          * **Type**: Automatically generated debug APK
          * **Build System**: Built by GitHub Actions
          * **Run Number**: ${RUN_NUM}
          * **Run Attempt**: ${RUN_ATTEMPT}
          * **Source Commit**: ${COMMIT_SHA}
          * **Purpose**: This APK is intended for testing and development purposes only.
          * **Production**: This is not a Play Store production release.
          * **Signing**: Signed only with a temporary debug keystore.
          EOF
          )
          echo "Publishing release: tag=$TAG, title=$TITLE, asset=$ASSET_PATH"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$COMMIT_SHA" \
            --latest
          echo "Release created successfully: $TAG"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.publish_release.outcome }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          TAG="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${RUN_NUM}"
            echo "APK Asset Filename: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}")
            echo "Release Page URL: $RELEASE_URL"
            echo "## 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Debug APK successfully built and published to GitHub Releases!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Release Title**: Debug APK Build #${RUN_NUM}" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Release Tag**: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "* **APK Asset File**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Direct Release Page**: [View GitHub Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download on Phone**: You can download the APK directly from the **Assets** section of the release page linked above." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Artifact**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully or was skipped (Outcome: $RELEASE_STATUS)."
            echo "=== Build Status ==="
            echo "The debug APK build succeeded. The GitHub Actions artifact named 'app-debug-apk' remains available."
            echo "## ⚠️ Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **The Debug APK was successfully built!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ GitHub Release publishing encountered an issue or was skipped (Outcome: \`$RELEASE_STATUS\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **How to Download the APK**: The verified debug APK is safely preserved as a GitHub Actions workflow artifact named **\`app-debug-apk\`**. You can download it directly from the Artifacts section at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
